<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dictionary</title>

<style>
body {
    margin: 0;
    padding: 30px 20px;
    font-family: Arial, sans-serif;
    background: #f5f8fc;
    color: #263445;
}

main {
    max-width: 800px;
    margin: auto;
}

h1 {
    color: #1769aa;
}

.search-modes {
    display: flex;
    gap: 8px;
    margin: 15px 0 10px;
}

.search-mode {
    padding: 9px 22px;
    border: 1px solid #ccd8e4;
    border-radius: 7px;
    background: white;
    color: #526477;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.search-mode.active {
    background: #1769aa;
    border-color: #1769aa;
    color: white;
}

.search-mode:hover {
    border-color: #1769aa;
}

#search {
    width: 100%;
    padding: 13px;
    margin: 5px 0 25px;
    border: 1px solid #ccd8e4;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

.entry {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 8px 15px;
    align-items: center;
    padding: 15px;
    background: white;
    border-bottom: 1px solid #e1e8ef;
}

.part-of-speech {
    color: #1769aa;
    font-size: 13px;
}

.word {
    font-weight: bold;
    font-size: 22px;
}

.translation {
    grid-column: 2;
    color: #526477;
    font-size: 15px;
}

#status {
    color: #64748b;
    margin-bottom: 15px;
}

@media (max-width: 550px) {
    .entry {
        grid-template-columns: 1fr;
        gap: 6px;
    }

    .translation {
        grid-column: 1;
    }

    .word {
        font-size: 21px;
    }
}
</style>
</head>

<body>
<main>
    <h1>Dictionary</h1>

    <div class="search-modes">
        <button class="search-mode active" data-mode="cr">
            ÇR
        </button>

        <button class="search-mode" data-mode="en">
            EN
        </button>
    </div>

    <input
        type="search"
        id="search"
        placeholder="Search Linguo çarmanta words..."
    >

    <p id="status">Loading dictionary...</p>
    <div id="dictionary"></div>
</main>

<script>
const dictionaryElement = document.getElementById("dictionary");
const searchInput = document.getElementById("search");
const statusElement = document.getElementById("status");
const modeButtons = document.querySelectorAll(".search-mode");

let dictionary = [];
let searchMode = "cr";

async function loadDictionary() {
    try {
        const response = await fetch("../data/dictionary.json");

        if (!response.ok) {
            throw new Error("Failed to load dictionary.");
        }

        dictionary = await response.json();

        displayDictionary(dictionary);
    } catch (error) {
        statusElement.textContent = error.message;
    }
}

function displayDictionary(entries) {
    dictionaryElement.replaceChildren();

    statusElement.textContent =
        `${entries.length} entries`;

    for (const entry of entries) {
        const row = document.createElement("div");
        row.className = "entry";

        const partOfSpeech = document.createElement("span");
        partOfSpeech.className = "part-of-speech";
        partOfSpeech.textContent = entry.partOfSpeech;

        const word = document.createElement("span");
        word.className = "word";
        word.textContent = entry.word;

        const translation = document.createElement("span");
        translation.className = "translation";
        translation.textContent = entry.translation;

        row.append(partOfSpeech, word, translation);
        dictionaryElement.appendChild(row);
    }
}

function searchDictionary() {
    const query = searchInput.value.trim().toLowerCase();

    const filtered = dictionary.filter(entry => {
        if (searchMode === "cr") {
            return entry.word.toLowerCase().includes(query);
        }

        return entry.translation.toLowerCase().includes(query);
    });

    displayDictionary(filtered);
}

modeButtons.forEach(button => {
    button.addEventListener("click", () => {
        searchMode = button.dataset.mode;

        modeButtons.forEach(btn => {
            btn.classList.toggle("active", btn === button);
        });

        searchInput.value = "";

        searchInput.placeholder =
            searchMode === "cr"
                ? "Search Linguo çarmanta words..."
                : "Search English meanings...";

        searchDictionary();
        searchInput.focus();
    });
});

searchInput.addEventListener("input", searchDictionary);

loadDictionary();
</script>
</body>
</html>
