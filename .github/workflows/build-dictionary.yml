name: Build Dictionary

on:
  push:
    paths:
      - "dict.txt"
      - "scripts/build_dictionary.py"
      - ".github/workflows/build-dictionary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate dictionary JSON
        run: python scripts/build_dictionary.py

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dictionary.json
          git diff --cached --quiet || git commit -m "Build dictionary JSON"
          git push
